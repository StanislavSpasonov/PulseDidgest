version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: pulsedidgest-postgres
    environment:
      POSTGRES_USER: pulsedidgest
      POSTGRES_PASSWORD: pulsedidgest
      POSTGRES_DB: pulsedidgest
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
